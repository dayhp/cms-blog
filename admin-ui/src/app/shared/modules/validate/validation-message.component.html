@let control = entityForm.controls[fieldName];
@if (control.invalid && control.dirty) {
  @for (validation of validationMessages[fieldName]; track validation.type) {
    @if (control.errors?.[validation.type]) {
      <small
        id="username-help"
        class="p-error">
        {{ validation.message }}.
      </small>
    }
  }
}
